name: Daily News Pipeline

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC â€” fetch news
    - cron: "15 6 * * *"   # 06:15 UTC â€” process (text)
    - cron: "30 6 * * *"   # 06:30 UTC â€” publish (image)
    - cron: "0 7 * * *"    # 07:00 UTC â€” trending
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (fetch|process|publish|trending|all)"
        required: false
        default: "all"

jobs:
  fetch-news:
    if: >-
      github.event.schedule == '0 6 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'fetch'))
    runs-on: ubuntu-latest
    steps:
      - name: Fetch news
        run: |
          curl --max-time 55 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/fetch-news" || true

  process-queue:
    if: >-
      github.event.schedule == '15 6 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'process'))
    runs-on: ubuntu-latest
    steps:
      - name: Process 1
        run: |
          curl --max-time 55 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-queue" || true
      - run: sleep 20
      - name: Process 2
        run: |
          curl --max-time 55 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-queue" || true
      - run: sleep 20
      - name: Process 3
        run: |
          curl --max-time 55 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-queue" || true

  publish-queue:
    if: >-
      github.event.schedule == '30 6 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'publish'))
    runs-on: ubuntu-latest
    steps:
      - name: Publish 1
        run: |
          curl --max-time 58 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/publish-queue" || true
      - run: sleep 35
      - name: Publish 2
        run: |
          curl --max-time 58 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/publish-queue" || true
      - run: sleep 35
      - name: Publish 3
        run: |
          curl --max-time 58 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/publish-queue" || true

  trending:
    if: >-
      github.event.schedule == '0 7 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == '' || github.event.inputs.job == 'all' || github.event.inputs.job == 'trending'))
    runs-on: ubuntu-latest
    steps:
      - name: Update trending keywords
        run: |
          curl --max-time 55 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/trending" || true

  noop:
    if: always()
    runs-on: ubuntu-latest
    needs: []
    steps:
      - run: echo "ok"
