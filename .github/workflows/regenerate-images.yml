name: Regenerate Article Images

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"   # every hour at :30

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Batch 1
        run: |
          curl --max-time 58 -s -w "\nstatus:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/admin/regenerate-images" || true
