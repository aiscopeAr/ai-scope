name: Regenerate Article Images

on:
  workflow_dispatch:   # trigger manually from GitHub Actions UI
  schedule:
    - cron: "30 * * * *"   # every hour at :30 — runs until all images fixed

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Batch 1
        run: |
          curl -f -s -w "\nStatus: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/admin/regenerate-images"

      - name: Wait 45s
        run: sleep 45

      - name: Batch 2
        run: |
          curl -f -s -w "\nStatus: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/admin/regenerate-images"

