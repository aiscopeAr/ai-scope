name: Process Prompts (Every 6h)

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process prompts batch 1
        run: |
          curl -s -w "\nStatus: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-prompts" || true

      - name: Wait 30s
        run: sleep 30

      - name: Process prompts batch 2
        run: |
          curl -s -w "\nStatus: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-prompts" || true

      - name: Wait 30s
        run: sleep 30

      - name: Process prompts batch 3
        run: |
          curl -s -w "\nStatus: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.lumiq.news/api/cron/process-prompts" || true
