name: Process Prompts (Every 6h)

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process prompts batch 1
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-prompts"

      - name: Wait 30s
        run: sleep 30

      - name: Process prompts batch 2
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-prompts"

      - name: Wait 30s
        run: sleep 30

      - name: Process prompts batch 3
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-prompts"
