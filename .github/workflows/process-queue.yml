name: Process Queue (Hourly)

on:
  schedule:
    - cron: "10 * * * *"   # every hour at :10
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process batch 1
        run: |
          curl -f -s -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"

      - name: Wait 35s
        run: sleep 35

