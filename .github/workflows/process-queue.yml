name: Process Queue (Hourly)

on:
  schedule:
    - cron: "10 * * * *"   # every hour at :10 (earlier, right after fetch)
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-queue API (run 1)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"

      - name: Wait 20s
        run: sleep 20

      - name: Call process-queue API (run 2)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"

      - name: Wait 20s
        run: sleep 20

      - name: Call process-queue API (run 3)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"

      - name: Wait 20s
        run: sleep 20

      - name: Call process-queue API (run 4)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"

      - name: Wait 20s
        run: sleep 20

      - name: Call process-queue API (run 5)
        run: |
          curl -f -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-news-ar.vercel.app/api/cron/process-queue"
