name: Process & Publish Queue (Hourly)

on:
  schedule:
    - cron: "10 * * * *"   # every hour at :10
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      # Each call: OpenAI text only ~8s. Gap 20s. Total: 10 calls = ~280s
      - name: Process 1
        run: curl --max-time 55 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/process-queue"
      - run: sleep 20
      - name: Process 2
        run: curl --max-time 55 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/process-queue"
      - run: sleep 20
      - name: Process 3
        run: curl --max-time 55 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/process-queue"
      - run: sleep 20
      - name: Process 4
        run: curl --max-time 55 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/process-queue"
      - run: sleep 20
      - name: Process 5
        run: curl --max-time 55 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/process-queue"
      - run: sleep 20

      # Now publish: each call Replicate+Cloudinary ~30s. Gap 35s.
      - name: Publish 1
        run: curl --max-time 58 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/publish-queue"
      - run: sleep 35
      - name: Publish 2
        run: curl --max-time 58 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/publish-queue"
      - run: sleep 35
      - name: Publish 3
        run: curl --max-time 58 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/publish-queue"
      - run: sleep 35
      - name: Publish 4
        run: curl --max-time 58 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/publish-queue"
      - run: sleep 35
      - name: Publish 5
        run: curl --max-time 58 -s -w "  status:%{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ai-news-ar.vercel.app/api/cron/publish-queue"
