<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="100%" stop-color="#a08060"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Subtle circuit lines -->
  <g opacity="0.15" stroke="#6366f1" stroke-width="0.8" fill="none">
    <line x1="20" y1="60" x2="50" y2="60"/><circle cx="50" cy="60" r="2" fill="#6366f1"/>
    <line x1="50" y1="60" x2="50" y2="40"/><line x1="50" y1="40" x2="80" y2="40"/>
    <line x1="150" y1="60" x2="175" y2="60"/><circle cx="150" cy="60" r="2" fill="#6366f1"/>
    <line x1="150" y1="60" x2="150" y2="40"/><line x1="150" y1="40" x2="120" y2="40"/>
    <line x1="25" y1="140" x2="45" y2="140"/><circle cx="45" cy="140" r="2" fill="#6366f1"/>
    <line x1="155" y1="140" x2="175" y2="140"/><circle cx="155" cy="140" r="2" fill="#6366f1"/>
  </g>

  <!-- Shirt / body -->
  <path d="M55 175 Q55 145 100 145 Q145 145 145 175 L145 200 L55 200 Z" fill="#1e1b4b"/>
  <!-- Collar -->
  <path d="M85 145 L100 162 L115 145" fill="none" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="91" y="128" width="18" height="20" rx="6" fill="url(#face)"/>

  <!-- Head -->
  <ellipse cx="100" cy="108" rx="32" ry="36" fill="url(#face)"/>

  <!-- Hair — short, neat, dark -->
  <path d="M68 100 Q70 70 100 68 Q130 70 132 100 Q128 72 100 70 Q72 72 68 100 Z" fill="#2d1a0e"/>
  <path d="M68 100 Q66 88 70 80 Q72 72 100 70 Q128 72 130 80 Q134 88 132 100" fill="#2d1a0e" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M81 97 Q88 94 93 96" stroke="#2d1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 96 Q112 94 119 97" stroke="#2d1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="104" rx="5.5" ry="5" fill="white"/>
  <ellipse cx="112" cy="104" rx="5.5" ry="5" fill="white"/>
  <circle cx="89" cy="104" r="3" fill="#2d1a0e"/>
  <circle cx="113" cy="104" r="3" fill="#2d1a0e"/>
  <circle cx="90" cy="103" r="1" fill="white" opacity="0.8"/>
  <circle cx="114" cy="103" r="1" fill="white" opacity="0.8"/>

  <!-- Nose -->
  <path d="M99 109 Q97 117 99 119 Q101 120 103 119 Q105 117 101 109" fill="none" stroke="#9a7050" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mouth — slight confident smile -->
  <path d="M91 125 Q100 130 109 125" stroke="#9a7050" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Glasses — thin techy frames -->
  <rect x="80" y="100" width="14" height="10" rx="3" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.8"/>
  <rect x="106" y="100" width="14" height="10" rx="3" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.8"/>
  <line x1="94" y1="105" x2="106" y2="105" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  <line x1="80" y1="105" x2="75" y2="107" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  <line x1="120" y1="105" x2="125" y2="107" stroke="#6366f1" stroke-width="1" opacity="0.8"/>

  <!-- Subtle indigo glow ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>

  <!-- AI badge -->
  <g filter="url(#glow)">
    <circle cx="140" cy="155" r="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="140" y="159" text-anchor="middle" font-size="8" font-weight="bold" fill="#6366f1" font-family="monospace">AI</text>
  </g>
</svg>
